sonar.projectKey=sxueck-llm-gateway
sonar.projectName=llm-gateway
sonar.sourceEncoding=UTF-8

sonar.sources=packages/backend/src,packages/web/src,packages/shared/src
sonar.tests=packages/backend/src
sonar.test.inclusions=**/*.test.ts

sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.test.ts,**/*.d.ts,packages/web/dist/**,scripts/**

sonar.javascript.lcov.reportPaths=packages/backend/coverage/lcov.info
sonar.typescript.lcov.reportPaths=packages/backend/coverage/lcov.info

# Import Semgrep findings as external issues (SARIF v2.1.0)
sonar.sarifReportPaths=semgrep.sarif
