version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: llm-gateway-mysql
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/conf.d:/etc/mysql/conf.d
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_PASSWORD:-your-mysql-password}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-llm_gateway}
    restart: unless-stopped
    networks:
      - llm-gateway-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  llm-gateway:
    image: ghcr.io/sxueck/llm-gateway:latest
    container_name: llm-gateway
    ports:
      - "13030:3000"
    volumes:
      - ../data:/app/data
      # Agent Search：网关经 docker.sock 拉起 worker 容器；workspace 目录
      # 会被 daemon 按「宿主机路径」bind 到 worker，因此必须与宿主机侧同路径挂载
      - ${AGENT_WORKSPACE_DIR:-/opt/llm-gateway/agent-workspaces}:${AGENT_WORKSPACE_DIR:-/opt/llm-gateway/agent-workspaces}
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - NODE_ENV=production
      - PORT=3000
      - LOG_LEVEL=info
      - JWT_SECRET=${JWT_SECRET:-please-change-this-secret-key-to-a-random-string-at-least-32-chars}
      - PUBLIC_URL=${PUBLIC_URL:-http://localhost:3000}
      - API_REQUEST_LOG_RETENTION_DAYS=${API_REQUEST_LOG_RETENTION_DAYS:-14}
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-your-mysql-password}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-llm_gateway}
      # Agent Search / craft-worker（须先完成 docs/docker-deployment.md 中的启用步骤）
      - AGENT_WORKER_IMAGE=${AGENT_WORKER_IMAGE:-ghcr.io/sxueck/llm-gateway/craft-worker:latest}
      # worker 在默认 bridge 网络，经 host-gateway 回连网关发布端口（13030）
      - AGENT_WORKER_GATEWAY_URL=${AGENT_WORKER_GATEWAY_URL:-http://host.docker.internal:13030}
      - AGENT_WORKSPACE_DIR=${AGENT_WORKSPACE_DIR:-/opt/llm-gateway/agent-workspaces}
      # 快照对象存储目录：代码默认值是 cwd 相对路径（/app/packages/backend/data/agent-snapshots），
      # 不在 ../data 挂载卷内，容器重建即丢失；必须显式指到 /app/data 下
      - AGENT_SNAPSHOT_STORAGE_DIR=${AGENT_SNAPSHOT_STORAGE_DIR:-/app/data/agent-snapshots}
    # 需与宿主机 docker 组 gid 一致（getent group docker | cut -d: -f3），用于读写 docker.sock
    group_add:
      - "${DOCKER_GID:-999}"
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - llm-gateway-network

networks:
  llm-gateway-network:
    driver: bridge

volumes:
  mysql-data:
