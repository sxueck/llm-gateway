name: Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write  # required for SARIF upload to GitHub Security tab

jobs:
  build:
    name: Build and analyze
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.2.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Stage 1/4 — Typecheck (advisory, non-blocking)
      # Mirrors analyze.sh's lint stage: surface issues but never block the pipeline.
      - name: Typecheck (advisory)
        continue-on-error: true
        run: npm run typecheck

      # Stage 2/4 — Semgrep security scan (advisory, non-blocking)
      # Security-focused ruleset: secrets leakage, Node.js pitfalls, OWASP Top 10.
      # Produces semgrep.sarif consumed by both SonarQube and GitHub Security tab.
      - name: Setup Python for Semgrep
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep scan
        continue-on-error: true
        run: |
          semgrep scan \
            --config p/security-audit \
            --config p/secrets \
            --config p/nodejs \
            --config p/owasp-top-ten \
            --metrics off \
            --sarif --output semgrep.sarif

      - name: Upload Semgrep SARIF to GitHub Security tab
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@4187e74d05793876e9989daffde9c3e66b4acd07 # v3.37.3
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      - name: Upload Semgrep artifacts
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: semgrep-sarif
          path: semgrep.sarif
          retention-days: 14

      # Stage 3/4 — Tests with coverage (blocking)
      # Produces packages/backend/coverage/lcov.info and test-results.junit.xml
      - name: Test with coverage
        run: npm run test:coverage -w @llm-gateway/backend
        env:
          NODE_ENV: test
          JWT_SECRET: ci-test-only-jwt-secret-must-be-at-least-32-characters
          MYSQL_PASSWORD: ci-test-password

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-report
          path: |
            packages/backend/coverage/
            packages/backend/test-results.junit.xml
          retention-days: 14

      # Stage 4/4 — SonarQube scan + Quality Gate (imports coverage + Semgrep SARIF)
      - name: SonarQube Scan
        if: github.event_name == 'push' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: SonarQube Quality Gate
        if: github.event_name == 'push' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
        uses: SonarSource/sonarqube-quality-gate-action@cf038b0e0cdecfa9e56c198bbb7d21d751d62c3b # v1.2.0
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # NFR-2: prove the local ONNX classifier (native ORT, external .data loading,
  # head weights, Qwen tokenizer, v4 policy) works end-to-end on the published
  # production architecture (linux/amd64, Node 22). The 615MB artifact download
  # is cached by pinned revision so this stays fast.
  onnx-smoke:
    name: Local ONNX classifier smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ONNX_MODEL_REVISION: e2cc76b77de09cdc46ac7877ec779a914d466660
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.2.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Restore pinned model artifacts
        id: cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: packages/backend/model-assets/intent-router-zh-setfit-v1
          key: onnx-intent-router-${{ env.ONNX_MODEL_REVISION }}

      - name: Download pinned model artifacts
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: packages/backend
        run: bun run download:onnx-model

      - name: Run classifier smoke test
        working-directory: packages/backend
        run: bun run test:onnx-smoke
